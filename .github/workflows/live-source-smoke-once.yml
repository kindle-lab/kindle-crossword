name: Live source smoke once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-source-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Korean일보 puzzle and parse with production core
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 60 \
            https://d3owq5b4yti859.cloudfront.net/puzzle.json -o /tmp/puzzle.json
          node - <<'NODE'
          const fs = require('fs');
          const core = require('./app/core.js');
          const raw = JSON.parse(fs.readFileSync('/tmp/puzzle.json', 'utf8'));
          const puzzle = core.buildPuzzle(raw);
          const articleCount = puzzle.clues.filter(c => !!c.articleUrl).length;
          if (!puzzle.clues.length) throw new Error('live puzzle has no clues');
          if (!puzzle.identity || !puzzle.identity.key) throw new Error('live puzzle identity missing');
          console.log(JSON.stringify({
            clueCount: puzzle.clues.length,
            articleLinkCount: articleCount,
            identitySource: puzzle.identity.source,
            identityKey: puzzle.identity.key,
            gridSize: core.GRID_SIZE
          }));
          NODE
