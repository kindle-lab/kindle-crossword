name: Release v0.4.2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.4.2-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source and appmgrd contract
        run: make test
      - name: Build and verify KPM package
        run: |
          make clean
          make package CROSSWORD_VERSION=0.4.2
      - name: Publish v0.4.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.2 release already exists"
            exit 0
          fi
          gh release create v0.4.2 \
            dist/korean-crossword-kindlehf.kpkg \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "한국일보 크로스워드 v0.4.2" \
            --notes "Kindle 5.19.6 appmgrd startup fix: register application association, stop stale app instances, and wait for appreg propagation before launching Mesquite."
