name: Cleanup temporary branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temp-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'DO-NOT-USE-temp',
              'cleanup-needed-temp',
              'release-runner-temp',
              'release-v0.4.0-staging',
              'release-v0.4.0-trigger',
              'temp-release-helper',
              'tmp-release-workflow'
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branch}`});
                core.info(`deleted ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) core.info(`already absent ${branch}`);
                else throw error;
              }
            }
