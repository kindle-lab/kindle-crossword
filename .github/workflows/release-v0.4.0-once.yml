name: Release v0.4.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.4.0-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source semantics
        run: make test
      - name: Build and verify KPM package
        run: |
          make clean
          make package CROSSWORD_VERSION=0.4.0
      - name: Publish v0.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 release already exists"
            exit 0
          fi
          gh release create v0.4.0 \
            dist/korean-crossword-kindlehf.kpkg \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "한국일보 크로스워드 v0.4.0" \
            --notes "Source-semantic redesign: cell-centric progress, stable puzzle identity, article-link preservation, offline cached startup, and shared production/test core."
